; Application overrides on top of php.ini-production.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M
date.timezone = Asia/Dhaka

; The image is rebuilt on every deploy, so cached bytecode never goes stale.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
